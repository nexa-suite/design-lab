<svg width="160" height="130" viewBox="0 0 160 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Action Camera Chassis -->
  <rect x="12" y="15" width="136" height="100" rx="16" fill="#181c20" stroke="#2c333a" stroke-width="3"/>
  <rect x="14" y="17" width="132" height="96" rx="14" fill="#222830"/>
  
  <!-- Subtle Texture & Grip -->
  <path d="M16 35 H24 M16 45 H24 M16 55 H24 M16 65 H24 M16 75 H24 M16 85 H24" stroke="#14181c" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Front LCD Screen (Blue Live Preview) -->
  <rect x="28" y="32" width="46" height="52" rx="6" fill="#0b1e36" stroke="#16325c" stroke-width="1.5"/>
  <rect x="30" y="34" width="42" height="48" rx="4" fill="#0052cc"/>
  <!-- Status Info on Screen -->
  <rect x="33" y="37" width="18" height="6" rx="2" fill="#00d8d6"/>
  <text x="34" y="42" font-family="system-ui, sans-serif" font-size="5" font-weight="bold" fill="#002b49">4K 60</text>
  <circle x="66" y="40" cx="66" cy="40" r="2.5" fill="#ff4d4f"/>
  <!-- Live Preview Horizon Graphic -->
  <path d="M30 65 L44 54 L56 62 L72 48 L72 82 L30 82 Z" fill="#003d99" opacity="0.8"/>
  <path d="M30 70 L48 58 L62 67 L72 59 L72 82 L30 82 Z" fill="#002966"/>
  
  <!-- Big Circular Camera Lens Barrel -->
  <circle cx="106" cy="62" r="34" fill="#121518" stroke="#373e47" stroke-width="4"/>
  <circle cx="106" cy="62" r="28" fill="#1b2026" stroke="#282f37" stroke-width="2"/>
  <!-- Optical Glass Element -->
  <circle cx="106" cy="62" r="22" fill="#0d1117"/>
  <circle cx="106" cy="62" r="16" fill="#080b10"/>
  <!-- Glass Glare & Multi-Coating Refraction -->
  <ellipse cx="101" cy="56" rx="10" ry="6" transform="rotate(-30 101 56)" fill="#3b82f6" fill-opacity="0.35"/>
  <ellipse cx="112" cy="68" rx="6" ry="3" transform="rotate(-30 112 68)" fill="#06b6d4" fill-opacity="0.25"/>
  <circle cx="98" cy="54" r="2.5" fill="#ffffff" fill-opacity="0.6"/>
  
  <!-- Red Recording Indicator LED -->
  <circle cx="34" cy="24" r="3" fill="#ff3838"/>
  <circle cx="34" cy="24" r="1" fill="#ffffff" fill-opacity="0.8"/>
  
  <!-- Subtle Model Number Badge -->
  <text x="32" y="94" font-family="system-ui, sans-serif" font-size="6" font-weight="900" fill="#64748b" letter-spacing="0.5">HERO 10</text>
</svg>

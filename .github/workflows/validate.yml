name: Design Lab validation

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: design-lab-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run validate:architecture
      - run: npm run validate:tokens
      - run: npm run validate:colors
      - run: npm run validate:icons
      - run: npm run validate:documentation
      - run: npm run validate:public-api
      - run: npm run validate:visual
      - run: npm run audit:visual
      - run: npm run validate:contrast
      - run: npm run test:library -- --watch=false
      - run: npm test -- --watch=false
      - run: npm run build:library
      - run: npm run validate:package
      - run: npm run build
      - run: npm run validate:browser
      - run: git diff --check

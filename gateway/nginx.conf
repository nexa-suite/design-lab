server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Landing Hub
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to web-style
    location /web/ {
        proxy_pass http://web-style:4200/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Reverse proxy to mobile-style
    location /mobile/ {
        proxy_pass http://mobile-style:4201/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Reverse proxy to website-style
    location /website/ {
        proxy_pass http://website-style:4321/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
